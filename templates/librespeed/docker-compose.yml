configs:
    librespeed-ts-serve:
        content: |
            {"TCP":{"443":{"HTTPS":true}},"Web":{"$${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://127.0.0.1:80"}}}}, "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  librespeed:
    image: lscr.io/linuxserver/librespeed:latest
    container_name: librespeed
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Taipei
      - PASSWORD=PASSWORD
    volumes:
      - ./config:/config
    # ports:
    #   - 80:80
    restart: unless-stopped
    network_mode: service:librespeed-ts
    depends_on:
      - librespeed-ts

  librespeed-ts:
    image: tailscale/tailscale:latest
    container_name: librespeed-ts
    hostname: librespeed
    environment:
      - TS_AUTHKEY=${TS_AUTH_KEY}
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_STATE_DIR=/var/lib/tailscale
    configs:
      - source: librespeed-ts-serve
        target: /config/serve.json
    volumes:
      - ./librespeed-ts-data:/var/lib/tailscale

    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      # - sys_module
    restart: unless-stopped
