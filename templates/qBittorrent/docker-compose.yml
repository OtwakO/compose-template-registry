configs:
    qbittorrent-ts-serve:
        content: |
            {"TCP":{"443":{"HTTPS":true}},"Web":{"$${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://127.0.0.1:8080"}}}}, "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  qBittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qBittorrent
    environment:
      - PUID=0
      - PGID=0
      - WEBUI_PORT=8080 # qBittorrent 端口
      - TZ=Asia/Taipei
    volumes:
      - ./qbittorrent-config:/config
      - /downloads:/downloads
      - /media:/media # 番剧挂载路径，两侧须保持一致

    network_mode: service:qbittorrent-ts
    depends_on:
      - qbittorrent-ts

  qbittorrent-ts:
    image: tailscale/tailscale:latest
    container_name: qbittorrent-ts
    hostname: qbittorrent
    environment:
      - TS_AUTHKEY=${TS_AUTH_KEY}
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_STATE_DIR=/var/lib/tailscale
    configs:
      - source: qbittorrent-ts-serve
        target: /config/serve.json
    volumes:
      - ./qbittorrent-ts-data:/var/lib/tailscale

    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      # - sys_module
    restart: unless-stopped
