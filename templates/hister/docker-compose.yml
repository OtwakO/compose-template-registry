configs:
  hister-ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},"Web":{"$${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://127.0.0.1:4433"}}}}, "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  hister:
    image: ghcr.io/asciimoo/hister:latest
    container_name: hister
    user: '1000:1000'
    restart: unless-stopped
    environment:
      - HISTER__SERVER__ADDRESS=0.0.0.0:4433
      - HISTER__SERVER__BASE_URL=http://192.168.1.100:4433 # Use your actual IP/hostname
      - HISTER__APP__SEARCH_URL=https://google.com.tw/search?q={query}
    volumes:
      - ./data:/hister/data
    # ports:
    #   - 4433:4433

    network_mode: service:hister-ts
    depends_on:
      - hister-ts

  hister-ts:
    image: tailscale/tailscale:latest
    container_name: hister-ts
    hostname: hister
    environment:
      - TS_AUTHKEY=${TS_AUTH_KEY}
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_STATE_DIR=/var/lib/tailscale
    configs:
      - source: hister-ts-serve
        target: /config/serve.json
    volumes:
      - ./hister-ts-data:/var/lib/tailscale

    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      # - sys_module
    restart: unless-stopped
