
configs:
    arcane-ts-serve:
        content: |
            {"TCP":{"443":{"HTTPS":true}},"Web":{"$${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://127.0.0.1:3552"}}}}, "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
    arcane:
        image: ghcr.io/getarcaneapp/arcane:latest
        container_name: arcane
        restart: unless-stopped
        # ports:
        #     - 3552:3552
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ./arcane-data:/app/data
            - /docker-projects:/app/data/projects
        environment:
            - APP_URL=https://arcane.airplane-scala.ts.net
            - PUID=1000
            - PGID=1000
            - ENCRYPTION_KEY=xxx
            - JWT_SECRET=xxx
            - LOG_LEVEL=info
            - LOG_JSON=false
            - OIDC_ENABLED=false
            - DATABASE_URL=file:data/arcane.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(2500)&_txlock=immediate

        network_mode: service:arcane-ts
        depends_on:
            - arcane-ts

    arcane-ts:
        image: tailscale/tailscale:latest
        container_name: arcane-ts
        hostname: arcane
        environment:
            - TS_AUTHKEY=xxx
            - TS_SERVE_CONFIG=/config/serve.json
            - TS_STATE_DIR=/var/lib/tailscale
        configs:
            - source: arcane-ts-serve
              target: /config/serve.json
        volumes:
            - ./arcane-ts-data:/var/lib/tailscale

        devices:
            - /dev/net/tun:/dev/net/tun
        cap_add:
            - net_admin
            # - sys_module
        restart: unless-stopped
