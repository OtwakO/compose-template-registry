
configs:
    arcane-ts-serve:
        content: |
            {"TCP":{"443":{"HTTPS":true}},"Web":{"$${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://127.0.0.1:3552"}}}}}

services:
    arcane:
        image: ghcr.io/getarcaneapp/arcane:latest
        container_name: arcane
        restart: unless-stopped
        # ports:
        #     - 3552:3552
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ./arcane-data:/app/data
            - /docker-projects:/app/data/projects
        environment:
            - APP_URL=http://localhost:3552
            - PUID=1000
            - PGID=1000
            - ENCRYPTION_KEY=44294ffbd55ed71f0427ee81226181b906e9adafbe9e669a5f866a57e85ff134
            - JWT_SECRET=a8c0892b6aa2acd0c3e52bd68d121d856975726ac184e51efccc7c99b172a69d
            - LOG_LEVEL=info
            - LOG_JSON=false
            - OIDC_ENABLED=false
            - DATABASE_URL=file:data/arcane.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(2500)&_txlock=immediate

        network_mode: service:arcane-ts
        depends_on:
            - arcane-ts

    arcane-ts:
        image: tailscale/tailscale:latest
        container_name: arcane-ts
        hostname: cloudcone-arcane
        environment:
            - TS_AUTHKEY=tskey-auth-ksFcJPdvaW11CNTRL-dr9HsyspmuPdpo15XF19uP3UwL69ELrhA
            - TS_STATE_DIR=/var/lib/tailscale
        configs:
            - source: arcane-ts-serve
              target: /config/serve.json
        volumes:
            - ./arcane-ts-data:/var/lib/tailscale

        # devices:
        #     - /dev/net/tun:/dev/net/tun
        cap_add:
            - net_admin
            # - sys_module
        restart: unless-stopped