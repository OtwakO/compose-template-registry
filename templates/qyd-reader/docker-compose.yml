configs:
  qyd-reader-ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},"Web":{"$${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://127.0.0.1:8080"}}}}, "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  read-server:
    image: ghcr.io/otwako/qyd-reader-docker:latest
    container_name: qyd-reader
    restart: unless-stopped
    # ports:
    #   - ":8080"
    volumes:
      # REQUIRED: Mount and override with your configuration file
      - ./conf.yml:/app/conf.yml
      # OPTIONAL: Mount storage for local books/covers if needed
      - ./data/local:/app/local
      - ./data/logs:/app/logs
      - ./data/storage:/app/storage
      # OPTIONAL: Mount database for persistent data if needed ! MUST CREATE A .DB FILE FIRST !
      - ./qyd-reader.db:/app/read.db
    environment:
      - TZ=Asia/Taipei

    network_mode: service:qyd-reader-ts
    depends_on:
      - qyd-reader-ts

  qyd-reader-ts:
    image: tailscale/tailscale:latest
    container_name: qyd-reader-ts
    hostname: qyd-reader
    environment:
      - TS_AUTHKEY=${TS_AUTH_KEY}
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_STATE_DIR=/var/lib/tailscale
    configs:
      - source: qyd-reader-ts-serve
        target: /config/serve.json
    volumes:
      - ./qyd-reader-ts-data:/var/lib/tailscale

    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      # - sys_module
    restart: unless-stopped
