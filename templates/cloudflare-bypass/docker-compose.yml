configs:
  cloudflare-bypass-ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},"Web":{"$${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://127.0.0.1:8000"}}}}, "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  cloudflare-bypass:
    image: ghcr.io/sarperavci/cloudflarebypassforscraping:latest
    container_name: cloudflare-bypass
    # ports:
    #   - 8000:8000
    environment:
      - WORKERS=3
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
    shm_size: 2g
    restart: unless-stopped 

    network_mode: service:cloudflare-bypass-ts
    depends_on:
      - cloudflare-bypass-ts

  cloudflare-bypass-ts:
    image: tailscale/tailscale:latest
    container_name: cloudflare-bypass-ts
    hostname: cloudflare-bypass
    environment:
      - TS_AUTHKEY=${TS_AUTH_KEY}
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_STATE_DIR=/var/lib/tailscale
    configs:
      - source: cloudflare-bypass-ts-serve
        target: /config/serve.json
    volumes:
      - ./cloudflare-bypass-ts-data:/var/lib/tailscale

    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      # - sys_module
    restart: unless-stopped
