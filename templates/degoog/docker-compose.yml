configs:
  degoog-ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},"Web":{"$${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://127.0.0.1:4444"}}}}, "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  degoog:
    image: ghcr.io/degoog-org/degoog:latest
    volumes:
      - ./data:/app/data
    # ports:
    #   - "4444:4444"
    restart: unless-stopped
    entrypoint: >
      sh -c "apk add --no-cache bash && curl -fsSL https://github.com/lexiforest/curl-impersonate/releases/download/v2.1.0/curl-impersonate-v2.1.0.x86_64-linux-musl.tar.gz
      | tar -xz -C /usr/local/bin || true && exec /entrypoint.sh"
    environment:
      # Leave both unset only for trusted local/LAN use. If this instance is
      # reachable from the internet, SET A PASSWORD: an unlocked instance lets
      # anyone install extensions, which runs code on the server.
      DEGOOG_SETTINGS_PASSWORDS: ${DEGOOG_SETTINGS_PASSWORDS}
      # When "true", every admin and store action stays behind the password
      # above even on a local network.
      DEGOOG_PUBLIC_INSTANCE: "false"

    network_mode: service:degoog-ts
    depends_on:
      - degoog-ts

  degoog-ts:
    image: tailscale/tailscale:latest
    container_name: degoog-ts
    hostname: degoog
    environment:
      - TS_AUTHKEY=${TS_AUTH_KEY}
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_STATE_DIR=/var/lib/tailscale
    configs:
      - source: degoog-ts-serve
        target: /config/serve.json
    volumes:
      - ./degoog-ts-data:/var/lib/tailscale

    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      # - sys_module
    restart: unless-stopped
