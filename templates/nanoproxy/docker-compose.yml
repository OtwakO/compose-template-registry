configs:
  nano-proxy-ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},"Web":{"$${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://127.0.0.1:8787"}}}}, "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  nano-proxy:
    image: ghcr.io/otwako/nanoproxy:latest
    # ports:
    #   - "8787:8787"
    environment:
      UPSTREAM_BASE_URL: https://nano-gpt.com/api/v1
      PROXY_HOST: localhost
      PROXY_PORT: 8787
    restart: unless-stopped

    network_mode: service:nano-proxy-ts
    depends_on:
      - nano-proxy-ts

  nano-proxy-ts:
    image: tailscale/tailscale:latest
    container_name: nano-proxy-ts
    hostname: nano-proxy
    environment:
      - TS_AUTHKEY=${TS_AUTH_KEY}
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_STATE_DIR=/var/lib/tailscale
    configs:
      - source: nano-proxy-ts-serve
        target: /config/serve.json
    volumes:
      - ./nano-proxy-ts-data:/var/lib/tailscale

    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      # - sys_module
    restart: unless-stopped
