configs:
  ffxiv-market-flipper-ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},"Web":{"$${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://127.0.0.1:16633"}}}}, "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  market-flipper:
    image: ghcr.io/otwako/ffxiv-market-flipper:latest
    container_name: ffxiv-market-flipper
    restart: unless-stopped
    # ports:
    #   - "16633:16633"
    environment:
      PORT: "16633"
      REGION: "繁中服"
      HOME_WORLD_ID: "4033"
      HOME_WORLD_NAME: "巴哈姆特"
      SCAN_ENTRIES: "100"
      SCAN_INTERVAL_SECONDS: "60"
      SCAN_MIN_ROI: "10"
      SCAN_MIN_PROFIT: "0"
      UNIVERSALIS_BASE_URL: "https://universalis.app"
      TZ: "Asia/Taipei"

    network_mode: service:ffxiv-market-flipper-ts
    depends_on:
      - ffxiv-market-flipper-ts

  ffxiv-market-flipper-ts:
    image: tailscale/tailscale:latest
    container_name: ffxiv-market-flipper-ts
    hostname: ffxiv-market-flipper
    environment:
      - TS_AUTHKEY=${TS_AUTH_KEY}
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_STATE_DIR=/var/lib/tailscale
    configs:
      - source: ffxiv-market-flipper-ts-serve
        target: /config/serve.json
    volumes:
      - ./ffxiv-market-flipper-ts-data:/var/lib/tailscale

    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      # - sys_module
    restart: unless-stopped
